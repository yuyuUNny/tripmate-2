spring:
  application:
    name: tripmate-api
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripmate}
    username: ${DATABASE_USER:tripmate}
    password: ${DATABASE_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
auth0:
  issuer: ${AUTH0_ISSUER:https://replace-me.us.auth0.com/}
  audience: ${AUTH0_AUDIENCE:https://api.tripmate.local}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
server:
  error.include-message: never
  max-http-request-header-size: 32KB
