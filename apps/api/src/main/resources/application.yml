spring:
  application:
    name: tripmate-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripmate}
    username: ${DATABASE_USER:tripmate}
    password: ${DATABASE_PASSWORD:local-development-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
server.error.include-message: never
